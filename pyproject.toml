[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-understanding"
version = "2.2.0"
description = "Evidence-chain personal memory for AI agents — verbatim-first, auditable, anti-fabrication. Ships as a skill + local stdio MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "caix84476-netizen" }]
keywords = [
    "mcp", "mcp-server", "claude", "claude-code", "codex",
    "memory", "personal-memory", "agent-memory", "local-first",
    "ai-agents", "personal-knowledge-management", "skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/caix84476-netizen/personal-understanding"
Repository = "https://github.com/caix84476-netizen/personal-understanding"
Documentation = "https://github.com/caix84476-netizen/personal-understanding/blob/main/README.md"

[project.scripts]
personal-understanding = "personal_understanding.mcp_server:main"
personal-understanding-install = "personal_understanding.install_mcp:main"

[tool.setuptools]
# scripts/ holds all stdlib-only modules; expose it as the personal_understanding package.
packages = ["personal_understanding"]
package-dir = { "personal_understanding" = "scripts" }

[tool.setuptools.package-data]
personal_understanding = ["*.json"]
